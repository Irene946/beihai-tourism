<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>精品路线 | 我的家乡 —— 广西北海</title>
  <meta name="description" content="北海四条精品路线：经典三日、亲子生态两日、文化寻踪两日、一日夜游美食，含行程时间轴。">
  <meta name="theme-color" content="#0A5C7E">
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-header="dark">

<div id="site-header"></div>

<main>
  <section class="page-head">
    <div class="container">
      <nav class="crumb" aria-label="面包屑"><a href="index.html">首页</a><span>›</span><span>精品路线</span></nav>
      <span class="badge">4 条精选行程</span>
      <h1 class="h1" style="color:#fff;margin-top:14px">挑一条路线，剩下的交给海风</h1>
      <p class="lead">按天数与兴趣选择路线，下方时间轴会同步更新每日行程；每条路线底部直接列出<b style="color:#FFD9A0">这条线上的景点与美食</b>，点卡片即可查看完整详情，不用再来回翻其他页面。路线可用 #锚点 分享，例如 routes.html#classic。</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div data-routes data-reveal></div>
    </div>
  </section>

  <section class="section section--soft">
    <div class="container">
      <div class="section-head" data-reveal>
        <span class="eyebrow">行前须知</span>
        <h2 class="h2">让行程更顺的 4 件事</h2>
      </div>
      <div class="grid grid-4">
        <div class="feature" data-reveal>
          <span class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
          <h3 class="h4">提前订船票</h3>
          <p class="text-soft">涠洲岛船票旺季紧张，提前 3-7 天在官方渠道预订。</p>
        </div>
        <div class="feature" data-reveal="120">
          <span class="feature-icon feature-icon--coral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v10"/><circle cx="12" cy="17" r="4"/></svg></span>
          <h3 class="h4">查潮汐表</h3>
          <p class="text-soft">赶海、五彩滩、红树林都受潮汐支配，按当日退潮时间安排。</p>
        </div>
        <div class="feature" data-reveal="240">
          <span class="feature-icon feature-icon--sand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
          <h3 class="h4">分区住宿</h3>
          <p class="text-soft">想看海住银海区银滩一带，想吃住海城区老街与侨港附近。</p>
        </div>
        <div class="feature" data-reveal="360">
          <span class="feature-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
          <h3 class="h4">留半天弹性</h3>
          <p class="text-soft">天气与航班可能变化，每天预留半天的机动时间更从容。</p>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/art.js"></script>

<script src="js/main.js"></script>
</body>
</html>
