      <p class="lead">一座不大却足够丰富的滨海城市。这里没有赶路的焦虑，只有潮起潮落的节奏。</p>

        <p class="lead">它有中国最细腻的沙滩之一，有最年轻的火山岛，有两千年的海丝史，也有五块钱一只的虾饼。昂贵的风景和便宜的快乐在这里共存，这就是我喜欢它的理由。</p>
        <p class="lead">如果你只想挑一个季节来，我推荐 9 月到次年 4 月：天高气爽，海鲜最肥。</p>
